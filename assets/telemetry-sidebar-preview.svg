    <rect x="56" y="348" width="38" height="8" rx="4" fill="#38BDF8"/>
    <rect x="94" y="348" width="12" height="8" fill="#F59E0B"/>
    <text x="156" y="356" class="mono" font-size="11" fill="#CBD5E1">42% · 420k/1m</text>

    <!-- Watch-Complication Arc Dial -->
    <circle cx="272" cy="352" r="7" stroke="#273042" stroke-width="2.2"/>
    <path d="M 272 345 A 7 7 0 1 1 265.4 354.5" stroke="#34D399" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="265.4" cy="354.5" r="2" fill="#ECFDF5"/>
    <text x="286" y="356" class="mono" font-size="11" fill="#E2E8F0">5h 82% · 7d 91%</text>
    <rect x="390" y="344" width="24" height="16" rx="4" fill="#1E2736"/>
    <text x="395" y="355" class="mono" font-size="10" fill="#94A3B8">+2</text>
