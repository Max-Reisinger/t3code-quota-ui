<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="960" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0C0E12"/>
      <stop offset="100%" stop-color="#12161E"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Inter", sans-serif; }
      .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    </style>
  </defs>

  <rect x="8" y="8" width="944" height="414" rx="14" fill="url(#cardBg)" stroke="#232832" stroke-width="1.5"/>

  <!-- LEFT PANEL: COMPOSER TELEMETRY STRIP + TURN METRICS -->
  <g transform="translate(28, 28)">
    <text x="0" y="16" class="sans" font-size="13" font-weight="600" fill="#94A3B8">① 底部输入框极简遥测条 + 消息级 TTFT 吞吐浮窗</text>

    <!-- Assistant Turn Bubble + TTFT Meta -->
    <rect x="0" y="34" width="432" height="154" rx="10" fill="#131821" stroke="#222938"/>
    <text x="16" y="60" class="sans" font-size="12" fill="#CBD5E1">已完成双列配额面板重构与多账号 OAuth 凭证隔离，所有测试通过。</text>
    <!-- Glass Hover Card -->
    <rect x="132" y="74" width="286" height="84" rx="8" fill="#181F2C" stroke="#2E3A50"/>
    <text x="146" y="94" class="sans" font-size="11" fill="#8B96A9">首屏回复</text>
    <text x="218" y="94" class="mono" font-size="11" font-weight="600" fill="#F1F5F9">310ms</text>
    <text x="284" y="94" class="sans" font-size="11" fill="#8B96A9">生成速度</text>
    <text x="346" y="94" class="mono" font-size="11" font-weight="600" fill="#34D399">94.6 tok/s</text>
    <text x="146" y="116" class="sans" font-size="11" fill="#8B96A9">输入缓存</text>
    <text x="218" y="116" class="mono" font-size="11" font-weight="600" fill="#38BDF8">99% 命中</text>
    <text x="284" y="116" class="sans" font-size="11" fill="#8B96A9">总耗时</text>
    <text x="346" y="116" class="mono" font-size="11" font-weight="600" fill="#F1F5F9">2.8s</text>
    <text x="292" y="146" class="mono" font-size="10" fill="#64748B">TTFT 310ms · 94.6 tok/s</text>

    <!-- Composer Box + Bottom Telemetry Strip -->
    <rect x="0" y="206" width="432" height="168" rx="12" fill="#141922" stroke="#283142"/>
    <text x="18" y="238" class="sans" font-size="13" fill="#64748B">输入任何问题… @ 文件，$ 技能，/ 命令</text>
    <rect x="16" y="294" width="128" height="24" rx="6" fill="#1C2330"/>
    <text x="28" y="310" class="sans" font-size="11" font-weight="500" fill="#E2E8F0">Gemini 4 · 高推理 ▾</text>
    <rect x="152" y="294" width="72" height="24" rx="6" fill="#1C2330"/>
